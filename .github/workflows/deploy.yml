name: Deploy BPM Workload Calculator to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auto-generate Vite scaffolding if missing
        run: |
          mkdir -p src
          if [ -f "App.jsx" ] && [ ! -f "src/App.jsx" ]; then
            cp App.jsx src/App.jsx
          fi

          if [ ! -f "package.json" ]; then
            cat << 'EOF' > package.json
          {
            "name": "bpm-workload-trca-calculator",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "lucide-react": "^0.454.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "@tailwindcss/vite": "^4.0.0",
              "@vitejs/plugin-react": "^4.3.3",
              "tailwindcss": "^4.0.0",
              "vite": "^6.0.0"
            }
          }
          EOF
          fi

          if [ ! -f "vite.config.js" ]; then
            cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          import tailwindcss from '@tailwindcss/vite'

          export default defineConfig({
            plugins: [react(), tailwindcss()],
            base: '/BPM-Workload-TRCA-Calculator/',
          })
          EOF
          fi

          if [ ! -f "index.html" ]; then
            cat << 'EOF' > index.html
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>BPM Workload & TRCA Point Calculator | India Post</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF
          fi

          if [ ! -f "src/index.css" ]; then
            echo '@import "tailwindcss";' > src/index.css
          fi

          if [ ! -f "src/main.jsx" ]; then
            cat << 'EOF' > src/main.jsx
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App.jsx'
          import './index.css'

          ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>,
          )
          EOF
          fi

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
